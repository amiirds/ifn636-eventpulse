<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EventPulse{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">Event<span>Pulse</span></a>
      {% if session.get('organiser_id') %}
        <nav aria-label="Organiser navigation">
          <a href="{{ url_for('events') }}">My events</a>
          <form method="post" action="{{ url_for('logout') }}">
            <button class="text-button" type="submit">Sign out</button>
          </form>
        </nav>
      {% endif %}
    </header>
    <main class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="notice {{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='location_autocomplete.js') }}" defer></script>
  </body>
</html>
